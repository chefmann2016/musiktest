<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Musik-Mission – Lerntrainer</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#202943;background:#f4f6ff}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(115deg,#5046c8,#a34cc4);color:white;padding:25px max(18px,calc((100vw - 1050px)/2));}h1{margin:0;font-size:clamp(25px,4vw,38px)}header p{margin:8px 0}main{max-width:1050px;margin:22px auto;padding:0 15px 40px}nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:#544bc4;color:white;min-height:44px}button:hover{filter:brightness(1.08)}button:disabled{opacity:.55;cursor:default}.ghost{background:white;color:#383475;border:1px solid #d4d6ee}.selected{outline:3px solid #ffbd55}.panel{background:white;border-radius:18px;padding:22px;box-shadow:0 4px 22px #28307112;margin-bottom:17px}.muted{color:#68718c}.pill{display:inline-block;background:#eae8ff;color:#4942a7;border-radius:20px;padding:5px 11px;font-size:13px;margin:3px}.choices{display:grid;gap:9px;margin:16px 0}.choices button{text-align:left;background:#f1f0fc;color:#27254e;border:1px solid #dcd9f5}.choices button.selected{background:#dedaff}.feedback{border-left:5px solid #665bd5;padding:12px 15px;background:#f1f0ff;margin:12px 0;border-radius:6px}.good{border-color:#1d9d74;background:#e7f8f0}.bad{border-color:#d98733;background:#fff3e5}.bar{height:12px;background:#e6e7f4;border-radius:20px;overflow:hidden}.bar span{display:block;height:100%;background:#39ad88}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.topic{border:1px solid #e1e3f1;border-radius:14px;padding:16px}.topic h3{margin:4px 0}.notation{width:100%;max-width:540px;height:auto;background:#fcfcff;border:1px solid #e4e6f2;border-radius:12px}.big{font-size:22px;font-weight:700}.question{font-size:20px;font-weight:650;margin:16px 0}.answer{width:100%;padding:13px;border:2px solid #d4d5e8;border-radius:12px;font:inherit}.mini{font-size:14px}.hide{display:none}footer{text-align:center;color:#747c94;padding:20px}.sound{background:#147e83}summary{cursor:pointer;font-weight:650}details{margin-top:12px}.score{font-size:35px;font-weight:800;color:#4d48b6} @media(max-width:600px){.panel{padding:15px}nav button{flex:1 1 auto;padding:10px}.question{font-size:18px}}
</style></head><body><header><h1>🎵 Musik-Mission</h1><p>Verstehen · Hören · Üben · Test bestehen</p></header><main><nav id="nav"></nav><div id="app"></div></main><footer>Offline-Lerntrainer · Fortschritt bleibt auf diesem Gerät gespeichert · Audio startet nach einem Klick</footer><script>
'use strict';
const topics=[
{id:'takt',title:'Taktarten & Betonung',intro:'Ein Takt ordnet Musik in regelmäßige Gruppen von Zählzeiten. Die obere Zahl sagt, wie viele Zählzeiten im Takt stehen. Die untere Zahl bezeichnet den Notenwert einer Zählzeit: 4 bedeutet Viertel, 8 bedeutet Achtel. Im 4/4-Takt zählen wir 1–2–3–4; die 1 ist besonders betont. Im 3/4-Takt zählt man 1–2–3. Der Auftakt ist ein unvollständiger Takt vor dem ersten vollständigen Takt.',example:'Klatsche im 3/4-Takt: EINS – zwei – drei | EINS – zwei – drei. Im 4/4-Takt: EINS – zwei – DREI – vier.',kind:'meter'},
{id:'rhythmus',title:'Rhythmus & Vocussion',intro:'Vocussion verbindet Voice (Stimme) und Percussion (Schlaginstrumente). Wir imitieren Schlagzeugklänge mit dem Mund. Bassdrum klingt tief („dun“), Snaredrum knackig („psch“), Hi-Hat kurz („ts“), ein offenes Hi-Hat länger („tss“). Ein Schlagzeug hat unter anderem Bassdrum, Snaredrum, Hi-Hat, Tom-Toms, Crash- und Ride-Becken. Beim Auftakt beginnt die Musik vor der ersten vollständigen Taktgruppe.',example:'Sprich im gleichmäßigen Puls: DUN – ts – PSCH – ts. Die Bassdrum liegt auf 1, die Snare auf 3.',kind:'beat'},
{id:'dynamik',title:'Dynamische Zeichen',intro:'Dynamik beschreibt, wie laut oder leise Musik gespielt wird. pp = pianissimo (sehr leise), p = piano (leise), mp = mezzopiano (mittelleise), mf = mezzoforte (mittellaut), f = forte (laut), ff = fortissimo (sehr laut). Crescendo bedeutet allmählich lauter werden; decrescendo (oder diminuendo) bedeutet allmählich leiser werden. Dynamik kann Spannung, Überraschung oder Ruhe erzeugen.',example:'Eine Melodie startet p und steigert sich mit crescendo bis f: Sie wird nach und nach lauter.',kind:'dyn'},
{id:'noten',title:'Notennamen & Oktavräume',intro:'Im Violinschlüssel liegen auf den fünf Linien von unten nach oben e¹, g¹, h¹, d², f². In den Zwischenräumen liegen f¹, a¹, c², e². Das c¹ (eingestrichenes c) steht auf einer Hilfslinie unter dem System; c² steht im dritten Zwischenraum. Eine Oktave ist der Abstand vom Ton bis zum nächsthöheren gleichnamigen Ton. Die Zahl beim Notennamen bezeichnet den Oktavraum.',example:'e¹ und e² haben denselben Buchstabennamen, liegen aber eine Oktave auseinander.',kind:'notes'},
{id:'zeichen',title:'Versetzungszeichen',intro:'Ein Kreuz (♯) erhöht einen Ton um einen Halbton; an den Notennamen wird -is angehängt (f → fis). Ein Be (♭) erniedrigt einen Ton um einen Halbton; oft wird -es angehängt (g → ges), mit Ausnahmen: h → b, e → es, a → as. Ein Auflösungszeichen (♮) hebt eine vorherige Erhöhung oder Erniedrigung auf. Ein Versetzungszeichen vor einer Note gilt normalerweise im selben Takt für denselben Ton in derselben Oktave, sofern es nicht aufgehoben wird.',example:'Vor einem f steht ♯: Du spielst fis. Vor h steht ♭: Du spielst b.',kind:'acc'},
{id:'enharmonik',title:'Enharmonische Verwechslung',intro:'Manche Töne können unterschiedlich heißen und auf einem gleichstufig gestimmten Klavier dieselbe Taste benutzen. Das heißt enharmonische Verwechslung. Beispiele: cis = des, dis = es, fis = ges, gis = as, ais = b. Welche Schreibweise sinnvoll ist, hängt vom musikalischen Zusammenhang ab.',example:'Cis und des haben unterschiedliche Namen, klingen am Klavier aber gleich hoch.',kind:'enh'}
];
const Q=[];function add(t,level,p,options,answer,why,type='choice',audio=null){Q.push({id:Q.length,t,level,p,options,answer,why,type,audio});}
// Takt
add('takt',1,'Wie viele Viertel-Zählzeiten hat ein 3/4-Takt?',['2','3','4','8'],1,'Die obere Zahl 3 steht für drei Zählzeiten.');add('takt',1,'Was bedeutet die untere 4 in 3/4?',['Vier Takte','Viertelnote als Zähleinheit','Vier Schläge pro Sekunde'],1,'Die untere Zahl 4 steht für Viertelnoten.');add('takt',1,'Welche Zählzeit wird im 3/4-Takt am stärksten betont?',['1','2','3'],0,'Die erste Zählzeit trägt die Hauptbetonung.');add('takt',2,'Ein Walzer wird EINS-zwei-drei gezählt. Welche Taktart passt?',['2/4','3/4','4/4'],1,'Die Dreiergruppe deutet auf 3/4.');add('takt',2,'Was ist ein Auftakt?',['Ein besonders lauter Takt','Ein unvollständiger Anfangstakt','Ein Takt ohne Rhythmus'],1,'Der Auftakt liegt vor dem ersten vollständigen Takt.');add('takt',2,'In 3/8 ist die Zähleinheit …',['eine Achtelnote','eine Viertelnote','eine Halbe'],0,'Die 8 unten steht für Achtelnoten.');add('takt',3,'Eine Melodie beginnt mit nur einer Viertelnote, bevor 3/4-Takte folgen. Was ist das?',['Auftakt','Schlussakkord','Crescendo'],0,'Der unvollständige Beginn ist ein Auftakt.');add('takt',3,'Ein Takt enthält vier Viertelnoten. Welche Taktart passt direkt?',['3/4','4/4','2/4'],1,'Vier Viertel ergeben einen 4/4-Takt.');add('takt',2,'Höre den betonten Puls. Welche Taktart wird geklopft?',['3/4','4/4','2/4'],0,'Die Betonung wiederholt sich nach drei Schlägen.','choice',{type:'meter',n:3});add('takt',2,'Höre den betonten Puls. Wie viele Schläge hat die Gruppe?',['2','3','4'],2,'Die Gruppe besteht aus vier Schlägen.','choice',{type:'meter',n:4});
// Vocussion
add('rhythmus',1,'Woraus setzt sich „Vocussion“ zusammen?',['Voice + Percussion','Violine + Bass','Volume + Piano'],0,'Stimme und Schlaginstrumente werden verbunden.');add('rhythmus',1,'Welcher Laut im Buch imitiert die Bassdrum?',['dun','ts','psch'],0,'Die Bassdrum klingt tief: dun.');add('rhythmus',1,'Welcher Laut steht für eine geschlossene Hi-Hat?',['dun','ts','tss'],1,'Die geschlossene Hi-Hat klingt kurz: ts.');add('rhythmus',1,'Welcher Laut steht für die Snaredrum?',['psch','dun','tss'],0,'Snaredrum: psch.');add('rhythmus',2,'Welches Instrument erzeugt eher einen tiefen, wuchtigen Schlag?',['Bassdrum','Hi-Hat','Crash-Becken'],0,'Die Bassdrum liefert den tiefen Puls.');add('rhythmus',2,'Welcher Schlagzeugteil ist ein Beckenpaar, das per Fußpedal geöffnet oder geschlossen wird?',['Hi-Hat','Snaredrum','Tom-Tom'],0,'Die Hi-Hat besteht aus zwei Becken.');add('rhythmus',2,'Wozu eignet sich eine regelmäßige Hi-Hat-Figur?',['Den Puls strukturieren','Die Tonart bestimmen','Eine Oktave erzeugen'],0,'Regelmäßige kurze Schläge machen die Unterteilung hörbar.');add('rhythmus',3,'Bei „dun – ts – psch – ts“ auf vier Schlägen: Welcher Schlag trägt die Snare?',['1','2','3','4'],2,'Die Snare erklingt auf dem dritten Schlag.');add('rhythmus',2,'Welches Instrument gehört NICHT zum abgebildeten Schlagzeug?',['Ride-Becken','Snaredrum','Klarinette'],2,'Eine Klarinette ist ein Blasinstrument.');add('rhythmus',3,'Was unterscheidet „ts“ und „tss“ in der Vocussion?',['ts ist kurz, tss klingt länger nach','ts ist immer lauter','Kein Unterschied'],0,'Das offene Hi-Hat klingt länger nach.');
// Dynamik
const dyn=[['pp','sehr leise'],['p','leise'],['mp','mittelleise'],['mf','mittellaut'],['f','laut'],['ff','sehr laut']];dyn.forEach(([sym,meaning],i)=>add('dynamik',1,'Was bedeutet '+sym+'?',['sehr leise','leise','mittelleise','mittellaut','laut','sehr laut'],i,'Die Bezeichnung lautet '+meaning+'.'));add('dynamik',2,'Welche Reihenfolge wird immer lauter?',['pp → p → mf → f','f → mf → p → pp','mf → pp → ff → p'],0,'Von pianissimo zu forte nimmt die Lautstärke zu.');add('dynamik',2,'Was bedeutet crescendo?',['Allmählich lauter','Plötzlich leise','Immer gleich laut'],0,'Crescendo ist ein Anstieg der Lautstärke.');add('dynamik',2,'Was bedeutet decrescendo?',['Schneller spielen','Allmählich leiser','Töne höher spielen'],1,'Decrescendo bedeutet leiser werden.');add('dynamik',3,'Ein Stück beginnt p und endet nach einem crescendo bei ff. Was ändert sich?',['Die Lautstärke nimmt zu','Die Tonhöhe sinkt','Der Takt wechselt'],0,'Dynamik betrifft Lautstärke, nicht zwingend Tempo oder Tonhöhe.');add('dynamik',3,'Welche Dynamik passt zu einer Musikstelle, die immer geheimnisvoller und leiser wird?',['crescendo','decrescendo','fortissimo'],1,'Für das allmähliche Leiserwerden ist decrescendo passend.');add('dynamik',2,'Welches Hörbeispiel wird lauter?',['Beispiel A','Beispiel B'],0,'Beispiel A hat zunehmende Lautstärke.','choice',{type:'pairdyn'});add('dynamik',2,'Was ist lauter: mp oder mf?',['mp','mf','gleich laut'],1,'Mezzoforte ist lauter als mezzopiano.');
// Noten
const pitchNames=['c¹','d¹','e¹','f¹','g¹','a¹','h¹','c²','d²','e²','f²','g²'];const midi=[60,62,64,65,67,69,71,72,74,76,77,79];pitchNames.forEach((n,i)=>add('noten',i<7?1:2,'Wie heißt die eingezeichnete Note?',[n,pitchNames[(i+3)%12],pitchNames[(i+7)%12]],0,'Die Note heißt '+n+'.','note',{midi:midi[i],label:n}));add('noten',1,'Welche Note liegt auf der untersten Linie im Violinschlüssel?',['e¹','g¹','c¹'],0,'Die unterste Linie ist e¹.');add('noten',1,'Welche Note steht auf einer Hilfslinie unter dem Violinschlüssel?',['c¹','f¹','a¹'],0,'Das eingestrichene c liegt auf der Hilfslinie.');add('noten',2,'Was ist eine Oktave?',['Abstand zu gleichnamigem nächsthöherem Ton','Immer drei Halbtonschritte','Eine Lautstärke'],0,'Von c¹ zu c² liegt eine Oktave.');add('noten',3,'Welche zwei Töne liegen genau eine Oktave auseinander?',['c¹ und c²','c¹ und d¹','e¹ und g¹'],0,'Gleicher Buchstabenname in benachbarten Oktavräumen.');
// Zeichen
add('zeichen',1,'Was bewirkt ein Kreuz ♯?',['Einen Halbton höher','Einen Ganzton tiefer','Lauter'],0,'Ein Kreuz erhöht um einen Halbton.');add('zeichen',1,'Was bewirkt ein Be ♭?',['Einen Halbton tiefer','Einen Halbton höher','Schneller'],0,'Ein Be erniedrigt um einen Halbton.');add('zeichen',1,'Was bewirkt ♮?',['Hebt die Versetzung auf','Macht den Ton länger','Macht den Ton lauter'],0,'Das Auflösungszeichen stellt den unversetzten Ton wieder her.');[['f','fis'],['c','cis'],['g','gis'],['d','dis'],['a','ais']].forEach(([a,b])=>add('zeichen',2,'Wie heißt '+a+' mit Kreuz ♯?',[b,a+'es',a],0,'Das Kreuz erzeugt '+b+'.'));[['h','b'],['e','es'],['a','as'],['g','ges'],['d','des']].forEach(([a,b])=>add('zeichen',2,'Wie heißt '+a+' mit Be ♭?',[b,a+'is',a],0,'Das Be erzeugt '+b+'.'));add('zeichen',3,'In einem Takt steht vor f¹ ein ♯. Später kommt f¹ ohne neues Zeichen. Was gilt normalerweise?',['Weiterhin fis¹','Wieder f¹','Immer f²'],0,'Das Versetzungszeichen gilt im selben Takt für dieselbe Tonhöhe weiter.');add('zeichen',3,'Nach einem fis steht vor demselben Ton ♮. Was spielst du?',['fis','f','ges'],1,'Das Auflösungszeichen macht aus fis wieder f.');
// Enharmonik
[['cis','des'],['dis','es'],['fis','ges'],['gis','as'],['ais','b']].forEach(([a,b])=>{add('enharmonik',2,'Welcher Ton klingt auf dem Klavier gleich hoch wie '+a+'?',[b,'c','f'],0,a+' und '+b+' sind enharmonisch gleich.');add('enharmonik',2,'Welche beiden Namen bezeichnen dieselbe Klaviertaste?',[a+' und '+b,a+' und '+a[0],b+' und g'],0,a+' und '+b+' bezeichnen dieselbe Tonhöhe.');});add('enharmonik',3,'Warum kann derselbe Klavierton zwei Namen haben?',['Wegen unterschiedlicher musikalischer Schreibweisen','Weil die Taste zwei Oktaven spielt','Weil die Lautstärke wechselt'],0,'Enharmonische Namen unterscheiden sich in der Notation, nicht in der Klaviertonhöhe.');add('enharmonik',3,'Sind cis und des im üblichen gleichstufig gestimmten Klavier verschieden hoch?',['Ja','Nein'],1,'Sie liegen auf derselben Taste.');
const KEY='musikMission_v3';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch{state={}};state.records ||= {};state.tests ||= [];state.visited ||= {};let page='home',active=topics[0].id,session=null,exam=null,choice=null,tries=0,hint=0,reviewMode=false;const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}};const topic=t=>topics.find(x=>x.id===t);const pool=t=>Q.filter(q=>q.t===t);const stats=t=>{let r=state.records[t]||{},correct=Object.values(r).filter(x=>x.correct>=2).length,distinct=Object.values(r).filter(x=>x.correct>0).length;return {correct,distinct,total:pool(t).length,mastered:distinct>=5&&correct>=3}};const shuffle=a=>[...a].sort(()=>Math.random()-.5);const sample=(a,n)=>shuffle(a).slice(0,n);const btn=(label,fn,cl='')=>`<button class="${cl}" onclick="${fn}">${label}</button>`;function navigate(p,t){page=p;if(t)active=t;session=null;exam=null;render()}function nav(){document.getElementById('nav').innerHTML=[['home','🏠 Übersicht'],['learn','📘 Lernen'],['practice','🧠 Tutor'],['review','🔁 Wiederholen'],['exam','📝 Musiktest'],['progress','📊 Fortschritt']].map(([id,n])=>`<button class="${page===id?'selected':'ghost'}" onclick="navigate('${id}')">${n}</button>`).join('')}
function render(){nav();if(page==='home')home();else if(page==='learn')learn();else if(page==='practice')practice();else if(page==='review')review();else if(page==='exam')examPage();else progress()}
function home(){let mastered=topics.filter(t=>stats(t.id).mastered).length;app.innerHTML=`<section class="panel"><h2>Deine Musik-Mission 🎶</h2><p>Du lernst in deinem Tempo. Höre Beispiele, beantworte Fragen und trainiere gezielt, bis du sicher bist.</p><div class="bar"><span style="width:${mastered/6*100}%"></span></div><p><b>${mastered} von 6 Themen</b> sicher beherrscht</p>${btn('Mit dem Lernen beginnen','navigate(\'learn\')')}</section><div class="grid">${topics.map(t=>`<div class="topic panel"><h3>${esc(t.title)}</h3><p class="mini muted">${state.visited[t.id]?'Kapitel geöffnet':'Noch nicht geöffnet'} · ${stats(t.id).mastered?'Sicher beherrscht':'Weiter üben'}</p>${btn('Kapitel öffnen',`navigate('learn','${t.id}')`,'ghost')}</div>`).join('')}</div>`}
function tabs(){return `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px">${topics.map((t,i)=>btn((i+1)+'. '+t.title,`navigate('${page}','${t.id}')`,active===t.id?'selected':'ghost')).join('')}</div>`}
function learn(){state.visited[active]=true;save();let t=topic(active);app.innerHTML=`<section class="panel">${tabs()}<h2>${esc(t.title)}</h2><p>${esc(t.intro)}</p><div class="feedback"><b>Merke:</b> ${esc(t.example)}</div>${illustration(t.kind)}<div style="margin-top:16px">${btn('🎧 Beispiel hören',`playExample('${t.kind}')`,'sound')} ${btn('Jetzt dieses Thema üben',`navigate('practice','${t.id}')`)}</div><details><summary>Was muss ich können?</summary><p>Begriffe erklären, Beispiele erkennen, Unterschiede beschreiben und das Gelernte auf neue Aufgaben anwenden.</p></details></section>`}
function illustration(k){if(k==='meter')return `<div class="panel"><h3>Takt klopfen</h3><p>Betone immer die erste Zählzeit.</p>${[2,3,4].map(n=>btn(n+'/4 anhören',`playMeter(${n})`,'ghost')).join(' ')}</div>`;if(k==='beat')return `<div class="panel"><h3>Schlagzeug und Vocussion</h3><div class="grid">${[['Bassdrum','dun',80],['Snaredrum','psch',38],['Hi-Hat','ts',1],['Offene Hi-Hat','tss',2]].map(([name,s,n])=>`<div class="topic"><b>${name}</b><p>${s}</p>${btn('▶ Hören',`playDrum(${n})`,'sound')}</div>`).join('')}</div>${btn('▶ Ganzen Rhythmus hören','playBeat()','sound')}</div>`;if(k==='dyn')return `<div class="panel"><h3>Von leise zu laut</h3><div class="grid">${dyn.map(([a,b],i)=>`<div class="topic" style="text-align:center"><div class="big">${a}</div><p>${b}</p>${btn('▶ Hören',`playTone(440,${.045+i*.085})`,'sound')}</div>`).join('')}</div>${btn('▶ Crescendo','playDynamic(true)','sound')} ${btn('▶ Decrescendo','playDynamic(false)','sound')}</div>`;if(k==='notes'||k==='acc'||k==='enh')return `<div class="panel"><h3>Noten auf der Notenlinie</h3>${staff(64)}<p>Die fünf Linien heißen von unten nach oben: e¹, g¹, h¹, d², f².</p>${btn('▶ Note hören','playMidi(64)','sound')} ${btn('▶ Tonleiter hören','playScale()','sound')}</div>`;return ''}
function staff(m,acc=''){let step={60:-2,62:-1,64:0,65:1,67:2,69:3,71:4,72:5,74:6,76:7,77:8,79:9}[m]??0;let y=126-step*10;let lines=[46,66,86,106,126].map(v=>`<line x1="25" x2="500" y1="${v}" y2="${v}" stroke="#66718b" stroke-width="1.6"/>`).join('');let ledger=step<0?`<line x1="195" x2="245" y1="146" y2="146" stroke="#66718b" stroke-width="1.7"/>`:step>8?`<line x1="195" x2="245" y1="26" y2="26" stroke="#66718b" stroke-width="1.7"/>`:'';return `<svg class="notation" viewBox="0 0 530 180" role="img" aria-label="Notensystem mit einer Note">${lines}<text x="45" y="124" font-size="95" font-family="serif">𝄞</text>${ledger}<ellipse cx="220" cy="${y}" rx="14" ry="9" fill="#292a55" transform="rotate(-20 220 ${y})"/><line x1="233" y1="${y}" x2="233" y2="${y-63}" stroke="#292a55" stroke-width="3"/>${acc?`<text x="174" y="${y+9}" font-size="30">${acc}</text>`:''}</svg>`}
let audioCtx=null;function audio(){let A=window.AudioContext||window.webkitAudioContext;if(!A)return null;if(!audioCtx)audioCtx=new A();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}function tone(freq,vol,start,dur=.22){let a=audio();if(!a)return;let o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=freq;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(Math.max(.001,vol),start+.015);g.gain.exponentialRampToValueAtTime(.0001,start+dur);o.start(start);o.stop(start+dur+.03)}function playTone(f=440,v=.2){let a=audio();if(a)tone(f,v,a.currentTime+.03,.5)}function playMidi(m){playTone(440*Math.pow(2,(m-69)/12),.18)}function playScale(){let a=audio();if(!a)return;midi.slice(0,8).forEach((m,i)=>tone(440*Math.pow(2,(m-69)/12),.16,a.currentTime+.05+i*.28,.25))}function playMeter(n){let a=audio();if(!a)return;for(let j=0;j<3;j++)for(let i=0;i<n;i++)tone(i===0?820:460,i===0?.3:.12,a.currentTime+.05+(j*n+i)*.42,.1)}function playDrum(n){let a=audio();if(!a)return;drum(n,a.currentTime+.04)}function drum(n,at){let a=audio();if(!a)return;let f=n===80?95:n===38?210:n===1?1100:750;let d=n===2?.32:n===1?.055:.14;let o=a.createOscillator(),g=a.createGain();o.type=n===80?'sine':n===38?'triangle':'square';o.frequency.setValueAtTime(f,at);if(n===80)o.frequency.exponentialRampToValueAtTime(48,at+.12);o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.13,at);g.gain.exponentialRampToValueAtTime(.0001,at+d);o.start(at);o.stop(at+d+.01)}function playBeat(){let a=audio();if(!a)return;for(let i=0;i<8;i++){let at=a.currentTime+.05+i*.34;drum(i%4===0?80:i%4===2?38:1,at)}}function playDynamic(up){let a=audio();if(!a)return;for(let i=0;i<8;i++)tone(440,(up?i+1:8-i)*.035,a.currentTime+.05+i*.3,.26)}function playExample(k){if(k==='meter')playMeter(3);else if(k==='beat')playBeat();else if(k==='dyn')playDynamic(true);else playScale()}
function questionHtml(q){return `<div class="pill">${esc(topic(q.t).title)} · Level ${q.level}</div><div class="question">${esc(q.p)}</div>${q.type==='note'?staff(q.audio.midi):''}${q.audio&&q.audio.type==='meter'?btn('▶ Rhythmus hören',`playMeter(${q.audio.n})`,'sound'):''}${q.audio&&q.audio.type==='pairdyn'?`${btn('▶ Beispiel A','playDynamic(true)','sound')} ${btn('▶ Beispiel B','playDynamic(false)','sound')}`:''}<div class="choices">${q.options.map((o,i)=>`<button id="opt${i}" onclick="pick(${i})">${esc(o)}</button>`).join('')}</div>`}
function getNext(t,exclude=[]){let r=state.records[t]||{},avail=pool(t).filter(q=>!exclude.includes(q.id));avail.sort((a,b)=>{let ra=r[a.id]||{},rb=r[b.id]||{};return (ra.correct||0)-(rb.correct||0) + (ra.attempts||0)*.08-(rb.attempts||0)*.08 + Math.random()*.3});return avail[0]||pool(t)[0]}
function practice(){if(!session||session.t!==active){session={t:active,q:getNext(active),seen:[]};choice=null;tries=0;hint=0}let q=session.q;app.innerHTML=`<section class="panel">${tabs()}<h2>🧠 Dein Lerntutor</h2><p>Erst nachdenken, dann antworten. Bei Fehlern erhältst du einen Hinweis.</p><p class="muted">${stats(active).distinct} unterschiedliche Aufgaben schon richtig · ${stats(active).mastered?'Thema sicher':'Noch nicht sicher'}</p><div id="qarea">${questionHtml(q)}</div><div id="feedback"></div><div id="actions">${btn('Antwort prüfen','checkPractice()')}</div></section>`}
function pick(i){choice=i;document.querySelectorAll('.choices button').forEach((b,j)=>b.classList.toggle('selected',i===j))}function record(q,correct){let r=state.records[q.t]||={};let v=r[q.id]||={attempts:0,correct:0};v.attempts++;if(correct)v.correct++;save()}
function checkPractice(){if(choice===null){document.getElementById('feedback').innerHTML='<div class="feedback bad">Wähle zuerst eine Antwort.</div>';return}let q=session.q;tries++;let ok=choice===q.answer;if(ok){record(q,true);document.getElementById('feedback').innerHTML=`<div class="feedback good">✅ Richtig! ${esc(q.why)}</div>`;document.getElementById('actions').innerHTML=btn('Nächste Aufgabe →','nextPractice()');document.querySelectorAll('.choices button').forEach(b=>b.disabled=true)}else if(tries===1){hint++;document.getElementById('feedback').innerHTML=`<div class="feedback bad">Noch nicht. Denk an die Erklärung aus dem Kapitel. ${q.type==='note'?'Zähle die Linien und Zwischenräume von unten.':q.audio?'Höre das Beispiel nochmals.':'Überlege, was der Fachbegriff genau bedeutet.'} Versuch es erneut!</div>`;choice=null;document.querySelectorAll('.choices button').forEach(b=>b.classList.remove('selected'))}else{record(q,false);document.getElementById('feedback').innerHTML=`<div class="feedback bad">Die richtige Antwort lautet <b>${esc(q.options[q.answer])}</b>. ${esc(q.why)}<p>Diese Aufgabe kommt später zur Wiederholung.</p></div>`;document.getElementById('actions').innerHTML=btn('Ähnliche Aufgabe üben →','nextPractice()');document.querySelectorAll('.choices button').forEach(b=>b.disabled=true)}}function nextPractice(){session.seen.push(session.q.id);session.q=getNext(active,session.seen);if(session.seen.length>=pool(active).length)session.seen=[];choice=null;tries=0;practice()}
function weakTopics(){return [...topics].sort((a,b)=>{let sa=stats(a.id),sb=stats(b.id);return Number(sa.mastered)-Number(sb.mastered)||sa.distinct-sb.distinct})}function review(){let w=weakTopics();app.innerHTML=`<section class="panel"><h2>🔁 Deine persönliche Wiederholung</h2><p>Ein Thema gilt erst als sicher, wenn mindestens fünf verschiedene Aufgaben richtig gelöst und mindestens drei davon wiederholt richtig beantwortet wurden.</p><div class="grid">${w.map(t=>{let s=stats(t.id);return `<div class="topic"><h3>${esc(t.title)}</h3><p>${s.mastered?'✅ Sicher':'🟠 Weiter üben'} · ${s.distinct}/${s.total} verschiedene Aufgaben richtig</p>${btn('Gezielt üben',`navigate('practice','${t.id}')`,'ghost')}</div>`}).join('')}</div></section>`}
function startExam(){let per=topics.map(t=>sample(pool(t.id),4));let selected=shuffle(per.flat());exam={questions:selected,index:0,answers:{},done:false};choice=null;examPage()}function examPage(){if(!exam){app.innerHTML=`<section class="panel"><h2>📝 Bin ich bereit für den Musiktest?</h2><p>24 zufällig ausgewählte Fragen aus ${Q.length} Aufgaben, vier aus jedem Kapitel. Keine Hinweise während der Prüfung. Am Ende erhältst du eine ausführliche Auswertung.</p>${btn('Prüfung starten','startExam()')}</section>`;return}if(exam.done){examResults();return}let i=exam.index,q=exam.questions[i];app.innerHTML=`<section class="panel"><h2>Bin ich bereit für den Musiktest?</h2><p>Frage ${i+1} von ${exam.questions.length}</p><div class="bar"><span style="width:${i/exam.questions.length*100}%"></span></div>${questionHtml(q)}<div id="feedback"></div>${btn(i===exam.questions.length-1?'Prüfung abgeben':'Antwort speichern & weiter', 'examNext()')}</section>`;choice=exam.answers[q.id]??null;if(choice!==null)pick(choice)}function examNext(){if(choice===null){document.getElementById('feedback').innerHTML='<div class="feedback bad">Bitte wähle eine Antwort.</div>';return}exam.answers[exam.questions[exam.index].id]=choice;exam.index++;choice=null;if(exam.index===exam.questions.length){exam.done=true;let correct=exam.questions.filter(q=>exam.answers[q.id]===q.answer).length;state.tests.unshift({date:new Date().toLocaleString('de-AT'),correct,total:exam.questions.length,byTopic:topics.map(t=>({t:t.id,c:exam.questions.filter(q=>q.t===t.id&&exam.answers[q.id]===q.answer).length,total:exam.questions.filter(q=>q.t===t.id).length}))});state.tests=state.tests.slice(0,30);exam.questions.forEach(q=>record(q,exam.answers[q.id]===q.answer));save()}examPage()}
function examResults(){let correct=exam.questions.filter(q=>exam.answers[q.id]===q.answer).length;let pct=Math.round(correct/exam.questions.length*100);app.innerHTML=`<section class="panel"><h2>Deine Testauswertung</h2><div class="score">${correct}/${exam.questions.length} Punkte (${pct} %)</div><p>${pct>=85?'Sehr gut! Du bist auf einem starken Weg.':pct>=65?'Gute Grundlage! Wiederhole noch die unsicheren Themen.':'Trainiere die schwierigen Themen nochmals gezielt.'}</p><h3>Ergebnis nach Themen</h3>${topics.map(t=>{let qs=exam.questions.filter(q=>q.t===t.id),c=qs.filter(q=>exam.answers[q.id]===q.answer).length;return `<p>${esc(t.title)}: ${c}/${qs.length}</p><div class="bar"><span style="width:${c/qs.length*100}%"></span></div>`}).join('')}<h3>Alle Antworten und Erklärungen</h3>${exam.questions.map((q,i)=>{let ok=exam.answers[q.id]===q.answer;return `<details ${!ok?'open':''}><summary>${ok?'✅':'❌'} ${i+1}. ${esc(q.p)}</summary><p>Deine Antwort: <b>${esc(q.options[exam.answers[q.id]])}</b></p><p>Richtig: <b>${esc(q.options[q.answer])}</b></p><p>${esc(q.why)}</p></details>`}).join('')}<p style="margin-top:20px">${btn('Schwächen wiederholen',`navigate('review')`)} ${btn('Neuen Test starten','startExam()','ghost')}</p></section>`}
function progress(){app.innerHTML=`<section class="panel"><h2>📊 Lernfortschritt</h2>${topics.map(t=>{let s=stats(t.id);return `<div class="topic" style="margin:12px 0"><b>${esc(t.title)}</b><p class="muted">${state.visited[t.id]?'Gelernt':'Noch nicht geöffnet'} · ${s.distinct} verschiedene Aufgaben richtig · ${s.correct} mehrfach richtig · ${s.mastered?'✅ Sicher':'🟠 Weiter üben'}</p><div class="bar"><span style="width:${Math.min(100,s.distinct/5*100)}%"></span></div></div>`}).join('')}<h3>Bisherige Tests</h3>${state.tests.length?state.tests.map(x=>`<p>${esc(x.date)} – <b>${x.correct}/${x.total}</b> Punkte</p>`).join(''):'<p>Noch kein Test absolviert.</p>'}<details><summary>Fortschritt zurücksetzen</summary><p>Dadurch werden alle lokal gespeicherten Übungen und Tests gelöscht.</p>${btn('Alle Daten löschen','resetData()','ghost')}</details></section>`}function resetData(){if(confirm('Wirklich alle Lernfortschritte und Testergebnisse löschen?')){localStorage.removeItem(KEY);state={records:{},tests:[],visited:{}};render()}}
render();
</script></body></html>
